
spring.application.name=ms-citas
server.port=8084

# Configuracion local
spring.config.import=optional:file:../../.env[.properties]

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/solicitudes_cita_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# Persistencia
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguridad JWT
mindset.jwt.secret=${JWT_SECRET}
mindset.interno.clave=${INTERNAL_API_KEY:}
mindset.profesionales.url=${PROFESIONALES_URL:http://localhost:8083}
mindset.procesamiento-local.habilitado=${PROCESAMIENTO_LOCAL_HABILITADO:false}


