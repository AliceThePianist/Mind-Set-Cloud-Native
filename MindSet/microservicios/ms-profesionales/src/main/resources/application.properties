
spring.application.name=ms-profesionales
server.port=8083

# Configuracion local
spring.config.import=optional:file:../../.env[.properties]

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/profesionales_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

# Persistencia
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Seguridad JWT
mindset.jwt.secret=${JWT_SECRET}
mindset.interno.clave=${INTERNAL_API_KEY:}

